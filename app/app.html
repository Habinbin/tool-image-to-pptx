<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			화면의 제목·설명은 `+layout.svelte` 가 manifest 에서 가져와 헤더로 그린다.
			여기 적은 값은 그것과 같은 문구지만 쓰임이 다르다 — 탭·검색결과·공유 카드처럼
			문서가 열리기 전에 읽히는 자리라 정적 HTML 에 박혀 있어야 한다.
		-->
		<title>이미지 to PPT</title>
		<meta
			name="description"
			content="이미지를 드롭하면 한 장씩 슬라이드에 꽉 채운 PPTX로 내보냅니다. 비율과 순서는 자동으로 잡습니다."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
